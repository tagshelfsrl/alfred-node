name: On PR

on:
  pull_request:
    branches:
      - master
      - development

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: tagshelfsrl/action-semantic-pull-request@main
        with:
          types: |
            chore
            docs
            fix
            feat
            misc
            test
            release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alfred-node
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the oldest version the library supports; the rest are the
        # versions customers run it on today.
        node: [18, 20, 22, 24]
    steps:
      - name: Checkout alfred-node
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install deps
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build
